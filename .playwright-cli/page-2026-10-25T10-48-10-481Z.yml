        - generic [ref=f2e53]:
          - heading "Problem" [level=2] [ref=f2e54]
          - paragraph [ref=f2e55]: Ziyaretçilerin beni tanıyabileceği, projelerimi ve becerilerimi görebileceği ve benimle iletişime geçebileceği kişisel bir web sitesine ihtiyacım vardı.
        - generic [ref=f2e56]:
          - heading "Geliştirdiklerim" [level=2] [ref=f2e57]
          - paragraph [ref=f2e58]: Bu web sitesini tek başıma tasarlayıp geliştirdim. Farklı ekran boyutlarına uyum sağlayan React arayüzünü, gezinme menüsünü, proje detay sayfalarını ve iletişim formunu hazırladım. Mesajları kaydeden ve gerekli yapılandırma yapıldığında Resend üzerinden e-posta bildirimi gönderen Supabase sunucu fonksiyonunu da geliştirdim.
        - generic [ref=f2e59]:
          - heading "Teknik kararlar" [level=2] [ref=f2e60]
          - list [ref=f2e61]:
            - listitem [ref=f2e62]: Metinleri sayfa bileşenlerine dokunmadan güncelleyebilmek için site ve proje içeriklerini TypeScript veri dosyalarında tutuyorum.
            - listitem [ref=f2e63]: Ana sayfada bölüm bağlantıları, proje detay sayfalarında ise React Router kullanıyorum. Böylece her projeye doğrudan bir adres üzerinden erişilebiliyor.
            - listitem [ref=f2e64]: Farklı ekran boyutlarına uyum sağlayan düzenler ve site genelinde ortak stiller oluşturmak için Tailwind CSS kullanıyorum.
            - listitem [ref=f2e65]: İletişim formundan gelen verileri, istekleri doğrulayıp mesajları kaydeden bir Supabase sunucu fonksiyonuna gönderiyorum. E-posta bildirimleri, API anahtarı tanımlandığında Resend üzerinden gönderiliyor; bu anahtar tarayıcı kodunda yer almıyor.
        - generic [ref=f2e66]:
          - heading "Sonuç" [level=2] [ref=f2e67]
          - paragraph [ref=f2e68]: Site; kendimi tanıttığım bölümü, becerilerimi ve proje bağlantılarımı bir araya getiriyor. Her proje için ayrı bir detay sayfası bulunuyor. İletişim formu, veri doğrulaması ve mesajları kaydetmek için Supabase entegrasyonu içeriyor.
        - generic [ref=f2e69]:
          - heading "Geliştirme notları" [level=3] [ref=f2e70]
          - article [ref=f2e71]:
            - heading "Portfolyomu geliştirirken" [level=3] [ref=f2e72]
            - paragraph [ref=f2e73]: Bu portfolyoyu React, TypeScript, Vite ve Tailwind CSS kullanarak kendim tasarlayıp geliştirdim. Ana sayfada kendimi tanıtıyor, projelerimi ve becerilerimi paylaşıyorum. Sayfada bir iletişim formu da bulunuyor. Proje içerikleri TypeScript veri dosyalarında tutuluyor. Proje kartları ve detay sayfaları aynı veriyi kullandığı için bir projenin açıklamasını, kullandığı teknolojileri ve geliştirme notlarını tek bir yerden güncelleyebiliyorum. React Router, her projenin adres tanımlayıcısını kullanarak ilgili detay sayfasını açıyor. İletişim formu, gönderilen verileri bir Supabase sunucu fonksiyonuna iletiyor. Bu fonksiyon verileri doğruluyor, gönderim sıklığı sınırlarını kontrol ediyor ve kabul edilen mesajları veritabanına kaydediyor. API anahtarı tanımlanmışsa Resend üzerinden e-posta bildirimi göndermeyi de deniyor.
